<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajira Connection - Jiunge Nasi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border-top: 8px solid #ff6600;
        }
        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #00aa66;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        .logo span {
            color: #ff6600;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 30px;
        }
        .btn-whatsapp {
            display: block;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
            text-decoration: none;
        }
        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">Ajira <span>Connection</span></div>
        
        <h2>Karibu Kwenye Jumuiya Yetu!</h2>
        <p>Ukurasa huu unakupeleka moja kwa moja kwenye WhatsApp Community ya Ajira Connection. Bonyeza kitufe hapa chini kujiunga ili usipitwe na nafasi za kazi na updates kila siku.</p>
        
        <a href="https://chat.whatsapp.com/DQFqYZMgQimIsPdyFOBhCW" class="btn-whatsapp">
            Jiunge na WhatsApp Community
        </a>
        
        <div class="footer">
            &copy; 2026 Ajira Connection. Haki zote zimehifadhiwa.
        </div>
    </div>

</body>
</html>
