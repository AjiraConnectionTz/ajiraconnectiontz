<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajira Zetu Tanzania</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; text-align: center; margin: 0; padding: 20px; }
        .container { background: white; max-width: 450px; margin: auto; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        img { width: 100%; border-radius: 15px; margin-bottom: 20px; }
        
        /* Hii ndio heading kuu pekee */
        .title { color: #003366; font-size: 24px; margin-bottom: 10px; font-weight: bold; }
        .orange { color: #ff9800; }
        
        .intro-text { color: #555; font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
        
        .sectors { text-align: left; margin-bottom: 25px; color: #333; font-size: 16px; font-weight: 600; }
        .sectors p { margin: 8px 0; }
        .sectors i { color: #ff9800; margin-right: 12px; }

        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; background-color: #25d366; color: white; padding: 18px; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 17px; transition: 0.3s; margin-bottom: 25px; }
        .btn:hover { background-color: #128c7e; }
        
        .socials { display: flex; justify-content: center; gap: 30px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
        .socials a { font-size: 32px; }
        .fb { color: #1877f2; } .ig { color: #e1306c; } .go { color: #db4437; }
        
        .footer { font-size: 12px; color: #888; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <img src="20711.jpg" alt="Ajira Zetu Tanzania">
    
    <!-- Kichwa cha habari kimoja tu -->
    <div class="title">Ajira Zetu <span class="orange">Tanzania</span></div>
    
    <p class="intro-text">
        Je, unatafuta ajira? Jiunge nasi kupata update za ajira mbalimbali. Ajira kama:
    </p>
    
    <div class="sectors">
        <p><i class="fas fa-check-circle"></i> Viwanda</p>
        <p><i class="fas fa-check-circle"></i> Vituo vya mafuta (Sheli)</p>
        <p><i class="fas fa-check-circle"></i> Migahawa</p>
        <p><i class="fas fa-check-circle"></i> Supermarket</p>
    </div>
    
    <a href="https://chat.whatsapp.com/JjcMJrYTQwN1f6CdJ7VLVZ" class="btn">
        <i class="fab fa-whatsapp"></i> JIUNGE NA GROUP SASA
    </a>

    <div class="socials">
        <a href="https://chat.whatsapp.com/JjcMJrYTQwN1f6CdJ7VLVZ" class="fb"><i class="fab fa-facebook"></i></a>
        <a href="https://chat.whatsapp.com/JjcMJrYTQwN1f6CdJ7VLVZ" class="ig"><i class="fab fa-instagram"></i></a>
        <a href="https://chat.whatsapp.com/JjcMJrYTQwN1f6CdJ7VLVZ" class="go"><i class="fab fa-google"></i></a>
    </div>

    <div class="footer">
        &copy; 2026 Ajira Zetu Tanzania. Haki zote zimehifadhiwa.
    </div>
</div>

</body>
</html>
