<!DOCTYPE html>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { background: #1e1e1e; max-width: 450px; margin: auto; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        .sectors i { color: #ff9800; margin-right: 15px; }

        .socials a { font-size: 32px; }
        .fb { color: #1877f2; } .ig { color: #e1306c; } .go { color: #db4437; }
        
        .footer { font-size: 12px; color: #888; border-top: 1px solid #333; padding-top: 15px; }
